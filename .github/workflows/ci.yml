name: CI and releases

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    name: Build and check tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-version.py "$RELEASE_TAG"
      - name: Build and test
        run: bash scripts/ci-check.sh
      - name: Save tested JAR
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-files
          path: target/release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-files
          path: release
      - name: Check artifact checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            release/multitenancy.jar release/SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
